name: Introduce code quality issues

# Demo helper: when run, this workflow creates a new branch that adds a "new
# feature" file (pizzeria/promo.py) with intentional code quality problems, then
# opens a pull request. Use it in Module 3 to show how Code Quality (CodeQL) and
# Copilot Code Review surface findings on a PR.
#
# The injected file is copied verbatim from demo/promo.py.txt. It is stored with
# a .txt extension so the baseline Code Quality scan of the default branch does
# NOT flag it -- the findings only appear once it lands on a PR as a real .py
# file. The file contains, on purpose:
#   * 6 issues CodeQL Code Quality flags as "Standard findings":
#       - an unused local variable (unused_tax)        -> maintainability
#       - an unused import (os)                        -> maintainability
#       - unreachable code after a return              -> maintainability
#       - a comparison of identical values (x == x)    -> reliability
#       - an 'is' comparison with a string literal     -> reliability
#       - a duplicate key in a dict literal            -> reliability
#   * 2 issues Copilot Code Review typically flags:
#       - a mutable default argument (history=[])      -> latent bug
#       - an O(n^2) loop in frequency_bonus()          -> performance
#
# Requires the repository (or org) setting:
#   Settings > Actions > General > "Allow GitHub Actions to create and approve
#   pull requests"  ->  enabled.

on:
  workflow_dispatch:
    inputs:
      pr_title:
        description: "Title for the generated pull request"
        required: false
        default: "Add loyalty promo feature"

permissions:
  contents: write
  pull-requests: write

jobs:
  open-bad-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure git identity
        run: |
          git config user.name "code-quality-demo-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create a feature branch
        id: branch
        run: |
          BRANCH="demo/loyalty-promo-${{ github.run_number }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"

      - name: Add the new feature (with intentional quality issues)
        run: |
          cp demo/promo.py.txt pizzeria/promo.py
          git add pizzeria/promo.py
          git commit -m "Add loyalty promo feature"
          git push origin "${{ steps.branch.outputs.branch }}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "${{ github.event.inputs.pr_title }}" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${{ steps.branch.outputs.branch }}" \
            --body "$(cat <<'BODY'
          ## Add loyalty promo feature

          This PR adds a `promo.py` module that rewards repeat customers.

          > 🧪 **Demo note:** this code was generated by the *Introduce code quality
          > issues* workflow and intentionally contains a few problems so you can see
          > how **Code Quality (CodeQL)** and **Copilot Code Review** react. Look for:
          > - an unused local variable and an always-true comparison (CodeQL)
          > - a mutable default argument and an O(n²) loop (Copilot Code Review)
          BODY
          )"
